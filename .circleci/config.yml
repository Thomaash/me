# Javascript Node CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
#
version: 2.1

executors:
  node:
    docker:
      - image: node:26.13.0@sha256:438603bbb5cda404b9416f0b5c8026f61501ab911760d861ec28c36b5d675725
    working_directory: ~/repo
    resource_class: small

  node-browsers:
    docker:
      - image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    working_directory: ~/repo
    resource_class: medium

jobs:
  build-and-test:
    executor: node-browsers

    steps:
      - checkout

      - run:
          name: Install pnpm
          command: npm install --global pnpm
      - run:
          name: Configure pnpm to keep its store in the workspace
          command: pnpm config set store-dir .pnpm-store

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run deps:ci
      - run: pnpm run style:ci
      - run: pnpm run lint:ci
      - run: pnpm run test:vitest:coverage
      - run: pnpm run test:e2e

      - persist_to_workspace:
          root: .
          paths:
            - ".git"
            - ".pnpm-store"
            - "bin"
            - "dist"
            - "node_modules"
            - "package.json"
            - "pnpm-lock.yaml"

  release:
    executor: node

    steps:
      - attach_workspace:
          at: .

      - run:
          name: Install pnpm
          command: npm install --global pnpm
      - run:
          name: Configure pnpm to keep its store in the workspace
          command: pnpm config set store-dir .pnpm-store

      - run:
          name: Copy old files from previous releases
          command: |
            pnpm run deploy-echoes

      - run:
          name: Prepare Git
          command: |
            git config user.email "$GIT_EMAIL"
            git config user.name "$GIT_NAME"

      - run:
          name: Publish
          command: |
            pnpm exec gh-pages --dist 'dist/me' --message 'chore: update GitHub Pages [ci skip]' --dotfiles --repo "https://$GH_USERNAME:$GH_TOKEN@github.com/Thomaash/me.git"

workflows:
  version: 2

  build:
    jobs:
      - build-and-test

      - release:
          requires:
            - build-and-test
          filters: pipeline.git.branch == "release"
