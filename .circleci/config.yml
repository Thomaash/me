# Javascript Node CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
#
version: 2.1

executors:
  node:
    docker:
      - image: node:24.15.0@sha256:e9891237dfbb1de60ce19e9ff9fac5d73ad9c37da303ad72ff2a425ad1057e71
    working_directory: ~/repo
    resource_class: small

  node-browsers:
    docker:
      - image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
    working_directory: ~/repo
    resource_class: medium

jobs:
  build-and-test:
    executor: node-browsers

    steps:
      - checkout

      - run:
          name: Install pnpm
          command: npm install --global pnpm
      - run:
          name: Configure pnpm to keep its store in the workspace
          command: pnpm config set store-dir .pnpm-store

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run deps:ci
      - run: pnpm run style:ci
      - run: pnpm run lint:ci
      - run: pnpm run test:vitest:coverage
      - run: pnpm run test:e2e

      - persist_to_workspace:
          root: .
          paths:
            - ".git"
            - ".pnpm-store"
            - "bin"
            - "dist"
            - "node_modules"
            - "package.json"
            - "pnpm-lock.yaml"

  release:
    executor: node

    steps:
      - attach_workspace:
          at: .

      - run:
          name: Install pnpm
          command: npm install --global pnpm
      - run:
          name: Configure pnpm to keep its store in the workspace
          command: pnpm config set store-dir .pnpm-store

      - run:
          name: Copy old files from previous releases
          command: |
            pnpm run build:old-deploy-files

      - run:
          name: Prepare Git
          command: |
            git config user.email "$GIT_EMAIL"
            git config user.name "$GIT_NAME"

      - run:
          name: Publish
          command: |
            pnpm exec gh-pages --dist 'dist/me' --message 'chore: update GitHub Pages [ci skip]' --dotfiles --repo "https://$GH_USERNAME:$GH_TOKEN@github.com/Thomaash/me.git"

workflows:
  version: 2

  build:
    jobs:
      - build-and-test

      - release:
          requires:
            - build-and-test
          filters:
            branches:
              only:
                - release
