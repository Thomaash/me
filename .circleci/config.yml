# Javascript Node CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
#
version: 2.1

executors:
  node:
    docker:
      - image: node:24.17.0@sha256:032e78d7e54e352129831743737e3a83171d9cc5b5896f411649c597ce0b11ea
    working_directory: ~/repo
    resource_class: small

  node-browsers:
    docker:
      - image: mcr.microsoft.com/playwright:v1.61.0-noble@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a
    working_directory: ~/repo
    resource_class: medium

jobs:
  build-and-test:
    executor: node-browsers

    steps:
      - checkout

      - run:
          name: Install pnpm
          command: npm install --global pnpm
      - run:
          name: Configure pnpm to keep its store in the workspace
          command: pnpm config set store-dir .pnpm-store

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run deps:ci
      - run: pnpm run style:ci
      - run: pnpm run lint:ci
      - run: pnpm run test:vitest:coverage
      - run: pnpm run test:e2e

      - persist_to_workspace:
          root: .
          paths:
            - ".git"
            - ".pnpm-store"
            - "bin"
            - "dist"
            - "node_modules"
            - "package.json"
            - "pnpm-lock.yaml"

  release:
    executor: node

    steps:
      - attach_workspace:
          at: .

      - run:
          name: Install pnpm
          command: npm install --global pnpm
      - run:
          name: Configure pnpm to keep its store in the workspace
          command: pnpm config set store-dir .pnpm-store

      - run:
          name: Copy old files from previous releases
          command: |
            pnpm run deploy-echoes

      - run:
          name: Prepare Git
          command: |
            git config user.email "$GIT_EMAIL"
            git config user.name "$GIT_NAME"

      - run:
          name: Publish
          command: |
            pnpm exec gh-pages --dist 'dist/me' --message 'chore: update GitHub Pages [ci skip]' --dotfiles --repo "https://$GH_USERNAME:$GH_TOKEN@github.com/Thomaash/me.git"

workflows:
  version: 2

  build:
    jobs:
      - build-and-test

      - release:
          requires:
            - build-and-test
          filters:
            branches:
              only:
                - release
