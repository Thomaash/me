# Javascript Node CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
#
version: 2.1

executors:
  node:
    docker:
      - image: node:24.19.0@sha256:4196d66a565c6f195728d9952f161f4adfe2ad753052a08b7ec7f1c5a6bda42b
    working_directory: ~/repo
    resource_class: small

  node-browsers:
    docker:
      - image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    working_directory: ~/repo
    resource_class: medium

jobs:
  build-and-test:
    executor: node-browsers

    steps:
      - checkout

      - run:
          name: Install pnpm
          command: npm install --global pnpm
      - run:
          name: Configure pnpm to keep its store in the workspace
          command: pnpm config set store-dir .pnpm-store

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run deps:ci
      - run: pnpm run style:ci
      - run: pnpm run lint:ci
      - run: pnpm run test:vitest:coverage
      - run: pnpm run test:e2e

      - persist_to_workspace:
          root: .
          paths:
            - ".git"
            - ".pnpm-store"
            - "bin"
            - "dist"
            - "node_modules"
            - "package.json"
            - "pnpm-lock.yaml"

  release:
    executor: node

    steps:
      - attach_workspace:
          at: .

      - run:
          name: Install pnpm
          command: npm install --global pnpm
      - run:
          name: Configure pnpm to keep its store in the workspace
          command: pnpm config set store-dir .pnpm-store

      - run:
          name: Copy old files from previous releases
          command: |
            pnpm run deploy-echoes

      - run:
          name: Prepare Git
          command: |
            git config user.email "$GIT_EMAIL"
            git config user.name "$GIT_NAME"

      - run:
          name: Publish
          command: |
            pnpm exec gh-pages --dist 'dist/me' --message 'chore: update GitHub Pages [ci skip]' --dotfiles --repo "https://$GH_USERNAME:$GH_TOKEN@github.com/Thomaash/me.git"

workflows:
  version: 2

  build:
    jobs:
      - build-and-test

      - release:
          requires:
            - build-and-test
          filters:
            branches:
              only:
                - release
