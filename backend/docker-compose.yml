version: '3.8'

services:
  backend:
    build: .
    container_name: me-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=file:/data/db.sqlite
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
    volumes:
      - backend-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/api/me"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  backend-data:
    driver: local
